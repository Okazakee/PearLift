appId: dev.okazakee.pearlift
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/finish-onboarding.yaml
- runFlow: ../subflows/open-settings.yaml
- scrollUntilVisible:
    element:
      id: settings.sync.expand
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings.sync.expand
- tapOn:
    id: settings.sync.create
- extendedWaitUntil:
    visible:
      id: sync.create.inviteText
    timeout: 30000
- tapOn:
    id: sync.create.close
- extendedWaitUntil:
    visible:
      id: settings.sync.deviceName
    timeout: 10000
- tapOn:
    id: settings.sync.deviceName
- eraseText
- inputText: E2E Device Alpha
- tapOn:
    id: settings.sync.renameDevice
- tapOn:
    id: settings.close
- runFlow: ../subflows/open-settings.yaml
- scrollUntilVisible:
    element:
      id: settings.sync.expand
    direction: DOWN
    timeout: 10000
- tapOn:
    id: settings.sync.expand
- scrollUntilVisible:
    element:
      id: settings.sync.debug
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: settings.sync.debug
- extendedWaitUntil:
    visible:
      id: syncDebug.summary
    timeout: 15000
- assertVisible: E2E Device Alpha
- tapOn:
    id: syncDebug.close
